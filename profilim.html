<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilim | Müşteri Memnun</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00C897">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">

    <style>
        /* Sadece profile özel düzenlemeler */
        .profile-hero { background: white; padding: 60px 20px; text-align: center; border-bottom: 1px solid #e2e8f0; }
        .user-avatar { width: 100px; height: 100px; border-radius: 50%; border: 4px solid #00C897; margin-bottom: 15px; }
        .empty-state { text-align: center; padding: 60px 20px; color: #94a3b8; }
    </style>
</head>
<body>

    <div id="header-holder"></div>

    <section class="profile-hero" id="userInfo" style="display:none;">
        <img id="userImg" src="" class="user-avatar" onerror="this.src='https://ui-avatars.com/api/?background=random'">
        <h2 id="userName" style="margin:0; font-weight:800; color:#0F172A;">...</h2>
        <p id="userMail" style="color:#64748b; margin-top:5px;">...</p>
        <button id="logoutBtn" style="margin-top:20px; background:none; border:1px solid #e2e8f0; padding:8px 20px; border-radius:50px; cursor:pointer; font-family:'Poppins'; font-weight:600; color:#ef4444;"><i class="fa-solid fa-right-from-bracket"></i> Çıkış Yap</button>
    </section>

    <div class="cards-wrapper">
        <h3 class="section-title"><i class="fa-solid fa-heart" style="color:#00C897;"></i> Yazdığın Teşekkürler</h3>
        <section class="cards-container" id="yazdigimTesekkurler">
            <div class="empty-state">Yükleniyor...</div>
        </section>
    </div>

    <div id="footer-holder"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAK7JEp06fVKaDrSggv9c7AkoPBzMubcZA",
        authDomain: "musterimemnun-cb039.firebaseapp.com",
        projectId: "musterimemnun-cb039",
        storageBucket: "musterimemnun-cb039.firebasestorage.app",
        messagingSenderId: "800433057522",
        appId: "1:800433057522:web:8357de2e3f74f250fd2a6b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Modüler Yapı Yükleme
    async function initPage() {
        document.getElementById('header-holder').innerHTML = await (await fetch('header.html')).text();
        document.getElementById('footer-holder').innerHTML = await (await fetch('footer.html')).text();
        
        // Header'daki arama motoru işlevlerini bağla (Eğer gerekirse)
        const searchInput = document.getElementById('mainSearchInput');
        if(searchInput) {
            searchInput.placeholder = "Hangi markaya teşekkür etmiştin?";
        }
    }
    initPage();

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('userInfo').style.display = 'block';
            document.getElementById('userName').innerText = user.displayName;
            document.getElementById('userMail').innerText = user.email;
            document.getElementById('userImg').src = user.photoURL;
            listele(user.uid);
        } else {
            window.location.href = 'index.html';
        }
    });

    document.getElementById('logoutBtn').onclick = () => signOut(auth).then(() => window.location.href='index.html');

    async function listele(uid) {
        const listeAlani = document.getElementById('yazdigimTesekkurler');
        try {
            const q = query(collection(db, "tesekkurler"), where("uid", "==", uid), orderBy("tarih", "desc"));
            const snap = await getDocs(q);
            
            if(snap.empty) {
                listeAlani.innerHTML = `<div class="empty-state">Henüz bir teşekkür yazmamışsın. İyiliği başlatmak için ilk teşekkürünü yazabilirsin!</div>`;
                return;
            }

            listeAlani.innerHTML = '';
            snap.forEach(doc => {
                const data = doc.data();
                const durumText = data.durum === 'onaylandi' ? '✅ Onaylandı' : '⏳ Beklemede';
                const durumColor = data.durum === 'onaylandi' ? '#059669' : '#d97706';
                
                listeAlani.innerHTML += `
                    <div class="card animated-card">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                            <h4 style="margin:0; text-transform:capitalize; color:#0F172A;">${data.marka}</h4>
                            <span style="font-size:11px; font-weight:700; color:${durumColor};">${durumText}</span>
                        </div>
                        <p class="card-text">"${data.mesaj}"</p>
                        ${data.jest ? `<div class="jest-kutusu"><i class="fa-solid fa-gift"></i> Marka Jesti: ${data.jest}</div>` : ''}
                    </div>
                `;
            });
        } catch (e) { console.error(e); }
    }
</script>
</body>
</html>
