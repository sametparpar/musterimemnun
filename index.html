<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Müşteri Memnun | Şikayet Etme, Teşekkür Et!</title>
    
    <meta name="description" content="Türkiye'nin ilk pozitif müşteri platformu. Markaların iyi niyetini ve müşterilerin takdirini buluşturuyoruz.">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00C897">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>
</head>
<body>

    <div id="header-holder"></div>

    <section class="hero premium-hero">
        <div class="hero-content">
            <h1>Mükemmel Hizmeti <span class="text-gradient">Alkışlıyoruz.</span></h1>
            <p>Sadece şikayet etmiyoruz; harika deneyimleri vitrine taşıyoruz.</p>
            
            <div class="brand-strip">
                <span><i class="fa-solid fa-bolt"></i> Trend Markalar:</span>
                <b onclick="markayaGoreFiltrele('trendyol')">Trendyol</b>
                <b onclick="markayaGoreFiltrele('getir')">Getir</b>
                <b onclick="markayaGoreFiltrele('yemeksepeti')">Yemeksepeti</b>
                <b onclick="markayaGoreFiltrele('hepsiburada')">Hepsiburada</b>
                <b onclick="markayaGoreFiltrele('arçelik')">Arçelik</b>
                <b onclick="markayaGoreFiltrele('thy')">THY</b>
            </div>
        </div>
    </section>

    <div id="dinamikVitrinAlani"></div>

    <div class="cards-wrapper">
        <h3 class="section-title"><i class="fa-solid fa-bolt" style="color:#F6E05E;"></i> Güncel Teşekkür Akışı</h3>
        <section class="cards-container" id="kartlarAlani"></section>
    </div>

    <div id="footer-holder"></div>

<script type="module">
    // --- MEVCUT TÜM FİREBASE VE VERİ YÜKLEME MANTIKLARIN BURADA AYNI KALACAK ---
    // (Arama, veriYukle, renderKart, renderVitrin, kartPaylas, PWA kaydı...)
    
    // YENİ: MODÜLER YÜKLEME (Madde 1)
    async function loadComponent(id, file) {
        const res = await fetch(file);
        const html = await res.text();
        document.getElementById(id).innerHTML = html;
    }

    window.onload = async () => {
        await loadComponent('header-holder', 'header.html');
        await loadComponent('footer-holder', 'footer.html');
        // Header yüklendikten sonra arama fonksiyonlarını başlat
        sistemdekiMarkalariYukle();
    };

    // KOŞULLU LOGO MANTIĞI (Madde 6)
    // renderKart fonksiyonundaki görsel kısmını şununla güncelle:
    // const finalLogo = data.logo_url ? data.logo_url : `https://ui-avatars.com/api/?name=${data.marka.substring(0,2)}&background=00C897&color=fff`;
</script>
</body>
</html>
