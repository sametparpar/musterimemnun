<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teşekkür Yaz | Müşteri Memnun</title>
    
    <meta name="description" content="Aldığınız mükemmel hizmeti ve güler yüzlü çalışanları takdir edin.">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00C897">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TTFE4XT3JN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-TTFE4XT3JN');
    </script>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* Sadece bu sayfaya özgü form yerleşimleri */
        .container { max-width: 600px; margin: 50px auto; padding: 30px; background: white; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #1A202C; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 1px solid #E2E8F0; border-radius: 8px; font-family: 'Poppins', sans-serif; font-size: 14px; box-sizing: border-box; background-color: white;}
        .form-group textarea { resize: vertical; min-height: 120px; }
        .submit-btn { width: 100%; background-color: #00C897; color: white; border: none; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { background-color: #00a87d; }
        #successMessage { display: none; background-color: #D1FAE5; color: #065F46; padding: 20px; border-radius: 10px; margin-top: 20px; border: 1px solid #A7F3D0; text-align: center; }
        
        .duygu-btn { padding: 10px 15px; border: 1px solid #E2E8F0; border-radius: 8px; background: white; cursor: pointer; transition: 0.2s; font-weight: 600; color: #4A5568; display: flex; align-items: center; gap: 8px; flex: 1; justify-content: center; }
        .duygu-btn[data-val="standart"]:hover, .duygu-btn.active[data-val="standart"] { background: #EBF8FF; border-color: #3182CE; color: #3182CE; }
        .duygu-btn[data-val="mutlu"]:hover, .duygu-btn.active[data-val="mutlu"] { background: #F0FDF4; border-color: #38A169; color: #38A169; }
        .duygu-btn[data-val="vay_canina"]:hover, .duygu-btn.active[data-val="vay_canina"] { background: #FFFFF0; border-color: #D69E2E; color: #D69E2E; }
        
        .tag-btn { padding: 6px 12px; border: 1px solid #E2E8F0; border-radius: 50px; background: white; cursor: pointer; font-size: 12px; transition: 0.2s; color: #4A5568; }
        .tag-btn.active { background: #00C897; color: white; border-color: #00C897; }

        .search-results { position: absolute; background: white; border: 1px solid #E2E8F0; width: 100%; max-height: 200px; overflow-y: auto; z-index: 10; border-radius: 8px; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 5px; }
        .search-item { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #EDF2F7; }
        .search-item:hover { background: #F7FAFC; }
    </style>
</head>
<body>

    <div id="header-holder"></div>

    <div style="text-align: center; margin-top: 40px; padding: 0 20px;">
        <h2 style="font-weight: 800; font-size: 32px; color: #1A202C; margin-bottom: 10px;">Birini Mutlu Et! 🌟</h2>
        <p style="color: #718096; max-width: 500px; margin: 0 auto;">Aldığın hizmeti takdir et. Markalar bu iyiliği karşılıksız bırakmıyor!</p>
    </div>

    <div class="container" id="formContainer">
        <div id="loginWarning" style="display:none; text-align:center; padding: 40px 20px;">
            <i class="fa-solid fa-lock" style="font-size: 40px; color: #CBD5E0; margin-bottom: 20px;"></i>
            <h3>Teşekkür Yazmak İçin Giriş Yapmalısın</h3>
            <button id="googleLoginBtn" class="submit-btn" style="background-color: #4285F4; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 20px;">
                <i class="fa-brands fa-google"></i> Google ile Güvenli Giriş Yap
            </button>
        </div>

        <div id="successMessage">
            <i class="fa-solid fa-circle-check" style="font-size: 50px; margin-bottom: 15px;"></i>
            <h3>Harikasın! 🎉</h3>
            <p>Teşekkürün moderasyon ekibimize ulaştı. Onaylandığında vitrinde yerini alacak.</p>
            <button onclick="window.location.href='index.html'" class="submit-btn" style="margin-top:20px;">Ana Sayfaya Dön</button>
        </div>

        <form id="tesekkurFormu" style="display:none;">
            <div class="form-group" style="position: relative;">
                <label>Hangi Markaya Teşekkür Ediyorsun?</label>
                <input type="text" id="markaArama" placeholder="Örn: Trendyol, Getir..." autocomplete="off" required>
                <input type="hidden" id="secilenMarkaId">
                <div id="searchResults" class="search-results"></div>
            </div>

            <div class="form-group">
                <label>Hangi Şehirde Yaşıyorsun?</label>
                <select id="sehir" required>
                    <option value="" disabled selected>Şehir Seçin</option>
                    <option value="Adana">Adana</option><option value="Adıyaman">Adıyaman</option><option value="Afyonkarahisar">Afyonkarahisar</option><option value="Ağrı">Ağrı</option><option value="Amasya">Amasya</option><option value="Ankara">Ankara</option><option value="Antalya">Antalya</option><option value="Artvin">Artvin</option><option value="Aydın">Aydın</option><option value="Balıkesir">Balıkesir</option><option value="Bilecik">Bilecik</option><option value="Bingöl">Bingöl</option><option value="Bitlis">Bitlis</option><option value="Bolu">Bolu</option><option value="Burdur">Burdur</option><option value="Bursa">Bursa</option><option value="Çanakkale">Çanakkale</option><option value="Çankırı">Çankırı</option><option value="Çorum">Çorum</option><option value="Denizli">Denizli</option><option value="Diyarbakır">Diyarbakır</option><option value="Edirne">Edirne</option><option value="Elazığ">Elazığ</option><option value="Erzincan">Erzincan</option><option value="Erzurum">Erzurum</option><option value="Eskişehir">Eskişehir</option><option value="Gaziantep">Gaziantep</option><option value="Giresun">Giresun</option><option value="Gümüşhane">Gümüşhane</option><option value="Hakkari">Hakkari</option><option value="Hatay">Hatay</option><option value="Isparta">Isparta</option><option value="İçel (Mersin)">İçel (Mersin)</option><option value="İstanbul">İstanbul</option><option value="İzmir">İzmir</option><option value="Kars">Kars</option><option value="Kastamonu">Kastamonu</option><option value="Kayseri">Kayseri</option><option value="Kırklareli">Kırklareli</option><option value="Kırşehir">Kırşehir</option><option value="Kocaeli">Kocaeli</option><option value="Konya">Konya</option><option value="Kütahya">Kütahya</option><option value="Malatya">Malatya</option><option value="Manisa">Manisa</option><option value="Kahramanmaraş">Kahramanmaraş</option><option value="Mardin">Mardin</option><option value="Muğla">Muğla</option><option value="Muş">Muş</option><option value="Nevşehir">Nevşehir</option><option value="Niğde">Niğde</option><option value="Ordu">Ordu</option><option value="Rize">Rize</option><option value="Sakarya">Sakarya</option><option value="Samsun">Samsun</option><option value="Siirt">Siirt</option><option value="Sinop">Sinop</option><option value="Sivas">Sivas</option><option value="Tekirdağ">Tekirdağ</option><option value="Tokat">Tokat</option><option value="Trabzon">Trabzon</option><option value="Tunceli">Tunceli</option><option value="Şanlıurfa">Şanlıurfa</option><option value="Uşak">Uşak</option><option value="Van">Van</option><option value="Yozgat">Yozgat</option><option value="Zonguldak">Zonguldak</option><option value="Aksaray">Aksaray</option><option value="Bayburt">Bayburt</option><option value="Karaman">Karaman</option><option value="Kırıkkale">Kırıkkale</option><option value="Batman">Batman</option><option value="Şırnak">Şırnak</option><option value="Bartın">Bartın</option><option value="Ardahan">Ardahan</option><option value="Iğdır">Iğdır</option><option value="Yalova">Yalova</option><option value="Karabük">Karabük</option><option value="Kilis">Kilis</option><option value="Osmaniye">Osmaniye</option><option value="Düzce">Düzce</option>
                </select>
            </div>

            <div class="form-group">
                <label>Nasıl Hissettin?</label>
                <div style="display: flex; gap: 10px;">
                    <button type="button" class="duygu-btn active" data-val="standart"><i class="fa-solid fa-thumbs-up"></i> Teşekkürler</button>
                    <button type="button" class="duygu-btn" data-val="mutlu"><i class="fa-solid fa-face-smile"></i> Çok Mutlu</button>
                    <button type="button" class="duygu-btn" data-val="vay_canina"><i class="fa-solid fa-star"></i> Vay Canına!</button>
                </div>
            </div>

            <div class="form-group">
                <label>Öne Çıkan Özellikler (En fazla 3 seçin)</label>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;" id="etiketAlani">
                    <button type="button" class="tag-btn">Hızlı Teslimat</button>
                    <button type="button" class="tag-btn">Güler Yüzlü Personel</button>
                    <button type="button" class="tag-btn">Kaliteli Paketleme</button>
                    <button type="button" class="tag-btn">Sorunsuz İade</button>
                    <button type="button" class="tag-btn">Hızlı Çözüm</button>
                    <button type="button" class="tag-btn">Harika İletişim</button>
                </div>
            </div>

            <div class="form-group">
                <label>Teşekkür Mesajın</label>
                <textarea id="mesaj" placeholder="Deneyimini detaylıca anlat..." required></textarea>
            </div>

            <div class="form-group" style="display:flex; align-items:center; gap:10px; background:#F7FAFC; padding:15px; border-radius:8px;">
                <input type="checkbox" id="gizliProfil" style="width:auto; transform: scale(1.2);">
                <label for="gizliProfil" style="margin:0; font-weight:500; font-size:14px; color:#4A5568;">İsmim markadan gizlensin</label>
            </div>

            <button type="submit" class="submit-btn" id="gonderBtn">Teşekkürü Gönder 🚀</button>
        </form>
    </div>

    <div id="footer-holder"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp, getDocs, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAK7JEp06fVKaDrSggv9c7AkoPBzMubcZA",
        authDomain: "musterimemnun-cb039.firebaseapp.com",
        projectId: "musterimemnun-cb039",
        storageBucket: "musterimemnun-cb039.firebasestorage.app",
        messagingSenderId: "800433057522",
        appId: "1:800433057522:web:8357de2e3f74f250fd2a6b"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    const db = getFirestore(app);

    let islemYapanKullanici = null;
    let tumMarkalar = [];

    // Modüler Yapıyı Yükle
    async function loadLayout() {
        try {
            document.getElementById('header-holder').innerHTML = await (await fetch('header.html')).text();
            document.getElementById('footer-holder').innerHTML = await (await fetch('footer.html')).text();
        } catch (e) { console.error(e); }
    }
    loadLayout();

    async function markalariGetir() {
        const snap = await getDocs(collection(db, "markalar"));
        snap.forEach(doc => { tumMarkalar.push({ id: doc.id, ad: doc.data().ad }); });
    }
    markalariGetir();

    onAuthStateChanged(auth, (user) => {
        if (user) {
            islemYapanKullanici = user;
            document.getElementById('loginWarning').style.display = 'none';
            document.getElementById('tesekkurFormu').style.display = 'block';
        } else {
            document.getElementById('tesekkurFormu').style.display = 'none';
            document.getElementById('loginWarning').style.display = 'block';
        }
    });

    document.getElementById('googleLoginBtn').onclick = () => signInWithPopup(auth, provider);

    const markaInput = document.getElementById('markaArama');
    const searchResults = document.getElementById('searchResults');
    const secilenMarkaIdInput = document.getElementById('secilenMarkaId');

    markaInput.addEventListener('input', function() {
        const val = this.value.toLocaleLowerCase('tr-TR');
        searchResults.innerHTML = '';
        if(!val) { searchResults.style.display = 'none'; return; }
        const filtered = tumMarkalar.filter(m => m.ad.toLocaleLowerCase('tr-TR').includes(val));
        if(filtered.length > 0) {
            filtered.forEach(m => {
                const div = document.createElement('div');
                div.className = 'search-item'; div.textContent = m.ad;
                div.onclick = () => { markaInput.value = m.ad; secilenMarkaIdInput.value = m.id; searchResults.style.display = 'none'; };
                searchResults.appendChild(div);
            });
        } else {
            const div = document.createElement('div');
            div.className = 'search-item'; div.innerHTML = `<b>"${this.value}"</b> sisteme eklenecek.`;
            div.onclick = () => { secilenMarkaIdInput.value = "yeni"; searchResults.style.display = 'none'; };
            searchResults.appendChild(div);
        }
        searchResults.style.display = 'block';
    });

    const duyguButonlari = document.querySelectorAll('.duygu-btn');
    duyguButonlari.forEach(btn => {
        btn.onclick = () => { duyguButonlari.forEach(b => b.classList.remove('active')); btn.classList.add('active'); };
    });

    const etiketButonlari = document.querySelectorAll('.tag-btn');
    etiketButonlari.forEach(btn => {
        btn.onclick = () => {
            const seciliSayisi = document.querySelectorAll('.tag-btn.active').length;
            if(btn.classList.contains('active')) btn.classList.remove('active');
            else if(seciliSayisi < 3) btn.classList.add('active');
        };
    });

    document.getElementById('tesekkurFormu').onsubmit = async (e) => {
        e.preventDefault();
        const gonderBtn = document.getElementById('gonderBtn');
        gonderBtn.disabled = true; gonderBtn.innerText = "Gönderiliyor...";

        try {
            let nihaiMarkaId = secilenMarkaIdInput.value;
            const yazilanMarka = markaInput.value.trim();
            if (!nihaiMarkaId || nihaiMarkaId === "yeni") {
                nihaiMarkaId = yazilanMarka.toLowerCase().replace(/[^a-z0-9]/g, '');
                await setDoc(doc(db, "markalar", nihaiMarkaId), { ad: yazilanMarka });
            }

            const secilenDuygu = document.querySelector('.duygu-btn.active').dataset.val;
            const secilenEtiketler = Array.from(document.querySelectorAll('.tag-btn.active')).map(el => el.textContent);

            await addDoc(collection(db, "tesekkurler"), {
                marka: nihaiMarkaId, isim: document.getElementById('gizliProfil').checked ? "Gizli Müşteri" : islemYapanKullanici.displayName,
                uid: islemYapanKullanici.uid, mesaj: document.getElementById('mesaj').value, sehir: document.getElementById('sehir').value,
                etiketler: secilenEtiketler, seviye: secilenDuygu, durum: "bekliyor", tarih: serverTimestamp()
            });
            
            document.getElementById('tesekkurFormu').style.display = 'none';
            document.getElementById('successMessage').style.display = 'block';
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        } catch (err) { console.error(err); gonderBtn.disabled = false; }
    };
</script>
</body>
</html>
