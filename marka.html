<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marka Profili | Müşteri Memnun</title>
    
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    <style>
        .brand-hero { background: white; padding: 80px 20px; text-align: center; border-bottom: 1px solid #e2e8f0; }
        .brand-logo-large { width: 120px; height: 120px; border-radius: 20px; border: 1px solid #e2e8f0; padding: 10px; background: white; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="header-holder"></div>

    <section class="brand-hero">
        <img id="markaLogo" src="" class="brand-logo-large" onerror="this.style.display='none'">
        <h1 id="markaAdi" style="margin:0; font-weight:800; text-transform:capitalize; color:#0F172A;">...</h1>
        <p id="markaSlogan" style="color:#64748b; margin-top:10px;">Marka profili yükleniyor...</p>
    </section>

    <div class="cards-wrapper">
        <h3 class="section-title"><i class="fa-solid fa-comments" style="color:#00C897;"></i> Marka Hakkındaki Teşekkürler</h3>
        <section class="cards-container" id="markaTesekkurleri"></section>
    </div>

    <div id="footer-holder"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAK7JEp06fVKaDrSggv9c7AkoPBzMubcZA",
        authDomain: "musterimemnun-cb039.firebaseapp.com",
        projectId: "musterimemnun-cb039",
        storageBucket: "musterimemnun-cb039.firebasestorage.app",
        messagingSenderId: "800433057522",
        appId: "1:800433057522:web:8357de2e3f74f250fd2a6b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // URL'den Marka ID'sini al
    const urlParams = new URLSearchParams(window.location.search);
    const markaId = urlParams.get('m');

    async function initPage() {
        document.getElementById('header-holder').innerHTML = await (await fetch('header.html')).text();
        document.getElementById('footer-holder').innerHTML = await (await fetch('footer.html')).text();
        
        if(markaId) {
            markaBilgisiGetir();
            tesekkurleriGetir();
        } else {
            window.location.href = 'index.html';
        }
    }
    initPage();

    async function markaBilgisiGetir() {
        const docSnap = await getDoc(doc(db, "markalar", markaId));
        if (docSnap.exists()) {
            const data = docSnap.exists() ? docSnap.data() : { ad: markaId };
            document.getElementById('markaAdi').innerText = data.ad;
            document.title = `${data.ad} Profili | Müşteri Memnun`;
            document.getElementById('markaSlogan').innerText = "Bu marka müşterileri tarafından takdir ediliyor.";
            
            const logo = data.logo_url || `https://ui-avatars.com/api/?name=${data.ad.substring(0,2)}&background=00C897&color=fff&bold=true`;
            document.getElementById('markaLogo').src = logo;
            document.getElementById('markaLogo').style.display = 'inline-block';
        }
    }

    async function tesekkurleriGetir() {
        const container = document.getElementById('markaTesekkurleri');
        const q = query(collection(db, "tesekkurler"), where("marka", "==", markaId), where("durum", "==", "onaylandi"));
        const snap = await getDocs(q);
        
        if(snap.empty) {
            container.innerHTML = `<p style="color:#94a3b8; text-align:center; width:100%;">Henüz onaylanmış bir teşekkür bulunmuyor.</p>`;
            return;
        }

        container.innerHTML = '';
        snap.forEach(doc => {
            const data = doc.data();
            container.innerHTML += `
                <div class="card animated-card">
                    <p class="card-text">"${data.mesaj}"</p>
                    <div style="margin-top:20px; padding-top:15px; border-top:1px solid #f1f5f9; display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:13px; font-weight:600; color:#334155;">${data.isim}</span>
                        <span style="font-size:12px; color:#94a3b8;"><i class="fa-solid fa-location-dot"></i> ${data.sehir || 'Belirtilmedi'}</span>
                    </div>
                </div>
            `;
        });
    }
</script>
</body>
</html>
