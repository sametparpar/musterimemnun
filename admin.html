<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetici Paneli | Müşteri Memnun</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #EDF2F7; }
        .admin-container {
            max-width: 800px; margin: 50px auto; background: white;
            padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .mesaj-karti { border: 1px solid #E2E8F0; padding: 20px; border-radius: 10px; margin-bottom: 15px; background-color: #F8FAFC; }
        .btn-onay { background-color: #00C897; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-sil { background-color: #E53E3E; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        /* Giriş Ekranı Tasarımı */
        #loginEkrani { text-align: center; padding: 50px 20px; }
        .btn-google { background-color: #4285F4; color: white; border: none; padding: 12px 25px; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; display: inline-flex; align-items: center; gap: 10px; }
        .btn-google:hover { background-color: #357ABD; }
        #adminIcerik { display: none; } /* İçerik başlangıçta gizli */
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">
            <i class="fa-solid fa-lock" style="color: #E53E3E;"></i> Yönetici <b>Paneli</b>
        </div>
        <div id="kullaniciBilgisi" style="font-weight: 600; font-size: 14px;"></div>
    </header>

    <div class="admin-container">
        
        <div id="loginEkrani">
            <h2>Yönetici Girişi</h2>
            <p style="color: #718096; margin-bottom: 30px;">Bu sayfaya sadece yetkili yöneticiler erişebilir.</p>
            <button id="googleLoginBtn" class="btn-google">
                <i class="fa-brands fa-google"></i> Google ile Giriş Yap
            </button>
        </div>

        <div id="adminIcerik">
            <h2>⏳ Bekleyen Teşekkürler</h2>
            <p>Aşağıdaki mesajlar henüz sitede görünmüyor. Onayladıkların ana sayfaya düşecek.</p>
            <hr style="border: 0; border-top: 1px solid #E2E8F0; margin-bottom: 20px;">
            <div id="mesajListesi"><p>Yükleniyor...</p></div>
            <button id="cikisBtn" style="margin-top: 30px; background: transparent; border: none; color: #E53E3E; cursor: pointer; text-decoration: underline;">Sistemden Çıkış Yap</button>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        // Kimlik doğrulama kütüphanelerini ekledik
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAK7JEp06fVKaDrSggv9c7AkoPBzMubcZA",
            authDomain: "musterimemnun-cb039.firebaseapp.com",
            projectId: "musterimemnun-cb039",
            storageBucket: "musterimemnun-cb039.firebasestorage.app",
            messagingSenderId: "800433057522",
            appId: "1:800433057522:web:8357de2e3f74f250fd2a6b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // 🚨 BURAYA GİRİŞ İZNİ VERDİĞİN E-POSTALARI YAZ 🚨
        const yetkiliEpostalar = [
            "sametparpar@gmail.com", 
            "varsa.ortaginin.adresi@gmail.com"
        ];

        const loginEkrani = document.getElementById('loginEkrani');
        const adminIcerik = document.getElementById('adminIcerik');
        const kullaniciBilgisi = document.getElementById('kullaniciBilgisi');

        // Giriş Yap Butonu
        document.getElementById('googleLoginBtn').addEventListener('click', () => {
            signInWithPopup(auth, provider).catch(error => console.error(error));
        });

        // Çıkış Yap Butonu
        document.getElementById('cikisBtn').addEventListener('click', () => {
            signOut(auth);
        });

        // Kullanıcı Durumunu Dinle (Giriş yaptı mı? Çıktı mı?)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Giriş yapıldı, peki yetkili listede mi?
                if (yetkiliEpostalar.includes(user.email)) {
                    // Evet, yetkili! Paneli aç.
                    loginEkrani.style.display = 'none';
                    adminIcerik.style.display = 'block';
                    kullaniciBilgisi.innerHTML = `<i class="fa-solid fa-user-check"></i> ${user.email}`;
                    bekleyenleriGetir(); // Mesajları çekmeye başla
                } else {
                    // Hayır, yetkisi yok. Dışarı at.
                    alert("Bu e-posta adresi için yönetici yetkisi bulunmuyor: " + user.email);
                    signOut(auth);
                }
            } else {
                // Giriş yapılmamış
                loginEkrani.style.display = 'block';
                adminIcerik.style.display = 'none';
                kullaniciBilgisi.innerHTML = '';
            }
        });

        // --- Eski Bekleyenleri Getir ve Onayla Kodları (Aynı) ---
        async function bekleyenleriGetir() {
            const listeDiv = document.getElementById('mesajListesi');
            listeDiv.innerHTML = ''; 
            const q = query(collection(db, "tesekkurler"), where("durum", "==", "bekliyor"));
            const querySnapshot = await getDocs(q);

            if (querySnapshot.empty) {
                listeDiv.innerHTML = '<p style="color: #718096; font-style: italic;">Şu an bekleyen yeni mesaj yok.</p>';
                return;
            }

            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                listeDiv.innerHTML += `
                    <div class="mesaj-karti" id="kart-${id}">
                        <div style="margin-bottom: 10px;">
                            <strong>Marka:</strong> <span style="color: #00C897;">${data.marka}</span> <br>
                            <strong>Kullanıcı:</strong> ${data.isim} <br>
                        </div>
                        <p style="background: white; padding: 10px; border-radius: 5px; border: 1px solid #E2E8F0;">"${data.mesaj}"</p>
                        <div style="margin-top: 15px; display: flex; gap: 10px;">
                            <button class="btn-onay" onclick="mesajOnayla('${id}')">✅ Onayla</button>
                            <button class="btn-sil" onclick="mesajSil('${id}')">🗑️ Sil</button>
                        </div>
                    </div>
                `;
            });
        }

        window.mesajOnayla = async function(id) {
            const kart = document.getElementById(`kart-${id}`);
            kart.style.opacity = "0.5";
            await updateDoc(doc(db, "tesekkurler", id), { durum: "onaylandi" });
            bekleyenleriGetir(); 
        };

        window.mesajSil = async function(id) {
            if(confirm("Bu mesajı kalıcı olarak silmek istediğinize emin misiniz?")) {
                const kart = document.getElementById(`kart-${id}`);
                kart.style.opacity = "0.5";
                await deleteDoc(doc(db, "tesekkurler", id));
                bekleyenleriGetir(); 
            }
        };
    </script>
</body>
</html>
